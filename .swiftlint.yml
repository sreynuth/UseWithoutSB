#  Created by Nin Sreynuth on 25/11/25.


# SwiftLint Configuration

disabled_rules:
  - line_length
  - trailing_whitespace     # Space
  - colon                   # (:)

opt_in_rules:
  - closure_body_length
  - unowned_variable_capture
  - unused_optional_binding

# Swift 6 Concurrency Rules
analyzer_rules:
  - unused_declaration
  - unused_import
  - explicit_self

included:
  - Programmatically
  
excluded:
  - Pods
  - Carthage
  - SwiftLint

type_name:
  allowed_symbols: "_"
  validates_start_with_lowercase: false

identifier_name:
  min_length: 1
  max_length: 40
  allowed_symbols: "_"
  excluded:
    - x
    - y
    - i
    - j
    - k
    - id
    - vm
    - db
    - ui

type_body_length:
  warning: 500
  error: 500


